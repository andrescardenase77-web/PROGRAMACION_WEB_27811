<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="mb-3">
        <input
            type="number"
            class="form-control"
            name=""
            id="numInicio"
            aria-describedby="helpId"
            placeholder="Ingrese Inicio"
        />
        <small id="helpId" class="form-text text-muted">Inicio</small>
    </div>

    <div class="mb-3">
        <input
            type="number"
            class="form-control"
            name=""
            id="numFin"
            aria-describedby="helpId"
            placeholder="INgrese Fin"
        />
        <small id="helpId" class="form-text text-muted">Fin</small>
    </div>

    <div class="d-grid gap-2">
        <button
            type="button"
            name=""
            id="btn_mostrar"
            class="btn btn-primary"
        >
            Mostrar secuencia
        </button>
    </div>
    

    <h1 id="result">Secuencia</h1>
    
    <script src="./public/js/tarea1.js"></script>
</body>
</html>
