<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Música Ecuatoriana</title>
    <link rel="icon" type="image/x-icon" href="./public/icons/icono.ico" />
    <!-- Google fonts-->
    <link
        href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="./public/vendor/template/css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="./public/css/estilos.css">
    <style>
        body {
            background-image: url('./public/img/fondo.png');

            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-titles-containerTP">
            <p class="site-heading-upperTP">ECUADOR REFLEJA SUS TRADICIONES A TRAVES DE SU MÚSICA</p>
            <h1 class="site-heading-lowerTP">EL RITMO DEL CORAZÓN DEL MUNDO</h1>
        </div>
    </header>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-dark py-lg-4" id="mainNav">
        <div class="container">
            <a class="navbar-brand text-uppercase fw-bold d-lg-none" href="./views/home.html"
                onclick="cargarPagina(event, this.href)">Start Bootstrap</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="./views/home.html"
                            onclick="cargarPagina(event, this.href)">INICIO</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="./views/about.html"
                            onclick="cargarPagina(event, this.href)">ACERCA DE</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="./views/products.html"
                            onclick="cargarPagina(event, this.href)">COMPOSITORES</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="./views/galmus.html"
                            onclick="cargarPagina(event, this.href)">GALERÍA MUSICAL</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="./views/contact.html"
                            onclick="cargarPagina(event, this.href)">CONTACTO</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <!-- AQUI VA EL CONTENIDO -->
    </main>

    <footer class="footer text-faded text-center py-5">
        <div class="container">
            <p class="m-0 small">DERECHOS RESERVADOS &copy; ANDINO CARDENAS MOLINA 2025</p>
        </div>
    </footer>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script>
        function cargarPagina(event, url) {
            event.preventDefault();

            const main = document.getElementById('main-content');

            fetch(url)
                .then(response => response.text()) //busca archivo externo
                .then(html => main.innerHTML = html) //muestra al cliente
                .catch(err => main.innerHTML = err)
        }
        cargarPagina(new Event('load'), "./views/home.html")
    </script>
</body>

</html>
