<body id="page-top">
    <header>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
            <div class="container">
                <a class="navbar-brand" href="./views/bienvenida.html" onclick="cargarPagina(event, this.href)">Inicio<img

                    Menu

                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                        <li class="nav-item"><a class="nav-link" href="./views/intereses.html"

    <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->

    <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>

    <script>
        function cargarPagina(event, url) {
            event.preventDefault();

            const main = document.getElementById('main-content');

            fetch(url)
                .then(response => response.text()) //busca archivo externo
                .then(html => main.innerHTML = html) //muestra al cliente
                .catch(err => main.innerHTML = err)
        }

        //aqui llamamos al metodo cargarPagina
        // cargarPagina("ruta de home")
        cargarPagina(new Event('load'), "./views/bienvenida.html")
    </script>
